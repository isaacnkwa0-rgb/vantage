    - generic [ref=f8e234]:
      - generic [ref=f8e235]:
        - generic [ref=f8e236]:
          - button "What is Catlog?" [ref=f8e237] [cursor=pointer]:
            - button [ref=f8e239]
          - region:
            - paragraph [ref=f8e242]: Catlog is an app that helps you run your business online with ease. With Catlog you can create an online store in 5 minutes, collect payments locally & internationally and manage your business records easily.
        - generic [ref=f8e243]:
          - button "Is Catlog a marketplace like Jumia?" [ref=f8e244] [cursor=pointer]:
            - button [ref=f8e246]
          - region:
            - paragraph [ref=f8e249]: No. Catlog is a business management app that helps you run your business efficiently. The online store you create with Catlog is yours to sell directly to your customers.
        - generic [ref=f8e250]:
          - button "Who can use Catlog?" [ref=f8e251] [cursor=pointer]:
            - button [ref=f8e253]
          - region:
            - paragraph [ref=f8e256]: Catlog is for business owners of all sizes who sell physical products online and want a simple way to manage their business — from fashion and food to beauty, personal care, electronics, and more.
        - generic [ref=f8e257]:
          - button "How do I get paid?" [ref=f8e258] [cursor=pointer]:
            - button [ref=f8e260]
          - region:
            - paragraph [ref=f8e263]: Catlog integrates with payment processors like Paystack so your customers can pay by card, transfer, or USSD. Payments are confirmed instantly, and the money goes into your Catlog account. From there, you can withdraw to your bank account anytime.
        - generic [ref=f8e264]:
          - button "Where is Catlog available?" [ref=f8e265] [cursor=pointer]:
            - button [ref=f8e267]
          - region:
            - paragraph [ref=f8e270]: Catlog is available in Nigeria, Ghana, South Africa & Kenya. Also, you don't need to be a registered business to use Catlog.
        - generic [ref=f8e271]:
          - button "Is Catlog free to use?" [ref=f8e272] [cursor=pointer]:
            - button [ref=f8e274]
          - region:
            - paragraph [ref=f8e277]: You can use Catlog free for 3 days. After the trial, you'll need to subscribe to one of our plans. The Basic plan costs ₦6,500 monthly, lets you upload up to 100 products, and gives you access to most of our core features. The Business+ plan costs ₦12,500 monthly and gives you unlimited product uploads, the ability to manage multiple stores from one account, accept international payments, upload product videos, and more.
      - paragraph [ref=f8e278]:
        - text: Still have questions? Email us at
        - link "support@catlog.shop" [ref=f8e279] [cursor=pointer]:
          - /url: mailto:holla@catlog.shop
